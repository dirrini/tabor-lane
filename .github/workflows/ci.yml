name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate configuration
        run: |
          docker compose config --quiet
          jq empty src/includes/i18n/main_en_US.json
          jq empty src/includes/i18n/main_pt_BR.json

      - name: Build application image
        run: docker compose build app

      - name: Start development stack
        run: docker compose up --detach --wait

      - name: Verify application and dependencies
        run: |
          curl --fail --retry 12 --retry-delay 5 http://localhost:8090/health/live
          curl --fail --retry 12 --retry-delay 5 http://localhost:8090/health/ready
          curl --fail http://localhost:8090/ | grep --quiet "TaborLane"
          curl --fail http://localhost:8090/app | grep --quiet "TaborLane"
          curl --fail http://localhost:8090/login | grep --quiet "TaborLane"
          docker compose exec -T postgres psql -U tabor_lane -d tabor_lane \
            -c "SELECT COUNT(*) FROM workspace;"
          docker compose run --rm minio-init

      - name: Show logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Stop stack
        if: always()
        run: docker compose down --volumes

  container:
    runs-on: ubuntu-latest
    needs: validate

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate multi-platform build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

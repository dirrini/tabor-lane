name: tabor-lane

services:
  migrate:
    image: flyway/flyway:11-alpine
    command:
      - -url=${DB_JDBC_URL:?DB_JDBC_URL is required}
      - -user=${DB_USER:?DB_USER is required}
      - -password=${DB_PASSWORD:?DB_PASSWORD is required}
      - -baselineOnMigrate=true
      - -baselineVersion=1
      - -connectRetries=15
      - migrate
    volumes:
      - ./scripts/postgres/migrations:/flyway/sql:ro
    restart: "no"

  app:
    image: ${APP_IMAGE:?APP_IMAGE is required}
    environment:
      APP_ENV: production
      DB_HOST: ${DB_HOST:?DB_HOST is required}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:?DB_NAME is required}
      DB_USER: ${DB_USER:?DB_USER is required}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      DB_SSL_MODE: ${DB_SSL_MODE:-require}
      APP_BASE_URL: ${APP_BASE_URL:?APP_BASE_URL is required}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:?GOOGLE_CLIENT_ID is required}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:?GOOGLE_CLIENT_SECRET is required}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:?GOOGLE_REDIRECT_URI is required}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:?STRIPE_SECRET_KEY is required}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:?STRIPE_WEBHOOK_SECRET is required}
      STRIPE_PRICE_PREMIUM_MONTHLY: ${STRIPE_PRICE_PREMIUM_MONTHLY:?STRIPE_PRICE_PREMIUM_MONTHLY is required}
      STRIPE_PRICE_PREMIUM_YEARLY: ${STRIPE_PRICE_PREMIUM_YEARLY:?STRIPE_PRICE_PREMIUM_YEARLY is required}
      BREVO_API_KEY: ${BREVO_API_KEY:?BREVO_API_KEY is required}
      BREVO_SENDER_EMAIL: ${BREVO_SENDER_EMAIL:?BREVO_SENDER_EMAIL is required}
      BREVO_SENDER_NAME: ${BREVO_SENDER_NAME:-Tabor Lane}
      UPSTASH_REDIS_REST_URL: ${UPSTASH_REDIS_REST_URL:-}
      UPSTASH_REDIS_REST_TOKEN: ${UPSTASH_REDIS_REST_TOKEN:-}
      STORAGE_ENDPOINT: ${STORAGE_ENDPOINT:?STORAGE_ENDPOINT is required}
      STORAGE_PUBLIC_ENDPOINT: ${STORAGE_PUBLIC_ENDPOINT:?STORAGE_PUBLIC_ENDPOINT is required}
      STORAGE_REGION: ${STORAGE_REGION:-auto}
      STORAGE_ACCESS_KEY: ${STORAGE_ACCESS_KEY:?STORAGE_ACCESS_KEY is required}
      STORAGE_SECRET_KEY: ${STORAGE_SECRET_KEY:?STORAGE_SECRET_KEY is required}
      STORAGE_BUCKET: ${STORAGE_BUCKET:-tabor-lane-attachments}
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
